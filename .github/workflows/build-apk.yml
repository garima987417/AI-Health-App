name: Build AI Health App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = AI Health App
          package.name = aihealthapp
          package.domain = org.garima
          source.dir = .
          source.main = ai_health_v19_android-6.py
          version = 19
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          repository_root: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Health-App-V19
          path: bin/*.apk
